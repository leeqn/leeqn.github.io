<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>movies</title>
    <link rel="stylesheet" href="h.css">

<body>

            <h1>MOVIE <br> <u>MARATHON</u></h1>
            <div class="square-box">
                <h2>MARATHON DATES:</h2>
                <p>&emsp;<span id="datesText" contenteditable="true">21.10.2026 -</span></p>
            </div>
            <h3>LIZA & DANYA</h3>
        </section>
        <section id="movies" class="section">
            <h4>Movie Collection Overview</h4>
            <div class="image-grid" id="movieGrid">
            </div>
        </section>
        <section id="ranking" class="section">
            <div class="top5-card">
                <h4>TOP 5 FAVORITES</h4>
                <h3>OUR HIGHEST-RATED FILMS</h3>
                <div class="top5-list" id="top5List"></div>
                <div class="notes-box">
                    <div class="notes-line" contenteditable="true"></div>
                    <div class="notes-line" contenteditable="true"></div>
                    <div class="notes-line" contenteditable="true"></div>

            </div>

    </main>
    <script src="index.js"></script>
